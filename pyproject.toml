[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secscan"
version = "0.1.0"
description = "SAST engine for secrets, Shannon entropy, API paths, and CI quality gates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Saulo Filho", email = "saulofilho@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://saulofilho.github.io/secscan/"
Repository = "https://github.com/saulofilho/secscan-python"
SourceEngine = "https://github.com/saulofilho/secscan"

[project.scripts]
secscan = "secscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
